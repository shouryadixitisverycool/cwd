<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..1000&display=swap">
<style>
/* Material 3 dark, the same tokens as the study guides */
:root{
  --surface:#131314; --s-lowest:#0e0e0f; --s-low:#1b1b1c; --s:#1f2021; --s-high:#2a2a2b; --s-highest:#353536;
  --on:#e3e3e3; --on-var:#c4c7c5; --outline:#8e918f; --outline-var:#444746;
  --primary:#a8c7fa; --on-primary:#062e6f; --sec-cont:#2b3a4f; --on-sec-cont:#d3e3fd;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px;
  --emph:cubic-bezier(.2,0,0,1); --emph-dec:cubic-bezier(.05,.7,.1,1);
  --font:"Roboto Flex",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@supports (corner-shape:squircle){ :root{--r-s:14px;--r-m:20px;--r-l:26px;--r-xl:44px} }
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--on);font:400 16px/1.5 var(--font);letter-spacing:.01em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.card,.back,.num{corner-shape:squircle}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:0 24px 80px}

/* state layers + ripple */
.ripple{position:relative;overflow:hidden;isolation:isolate}
.ripple::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s;z-index:-1;pointer-events:none}
.ripple:hover::before{opacity:.08} .ripple:active::before{opacity:.12}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);pointer-events:none;z-index:-1;animation:rip .6s var(--emph) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* home hero */
.hero{text-align:center;padding:120px 0 72px}
.mark{font:900 128px/1 var(--font);font-variation-settings:"wdth" 151,"opsz" 144;letter-spacing:-.045em;margin:0;color:#e3e9ff}
.tag{margin:18px 0 0;color:var(--on-var);font-size:16px}

/* section head */
.head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 14px}
.head h2{font:500 14px/20px var(--font);letter-spacing:.01em;margin:0;color:var(--on)}
.head span{font-size:14px;color:var(--outline)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:36px}
.card{display:flex;flex-direction:column;gap:4px;background:var(--s-low);border-radius:var(--r-xl);padding:20px 22px 20px;min-height:116px;
  color:var(--on);transition:background .3s var(--emph)}
.card:hover{background:var(--s)}
.over{font:500 12.5px/16px var(--font);letter-spacing:.06em;color:var(--primary);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.over .ic{width:16px;height:16px}
.title{font:400 18px/24px var(--font);color:var(--on);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{margin-top:auto;padding-top:8px;font-size:13.5px;color:var(--on-var)}
.card.pdf .over{color:var(--on-var)}
.ic{width:20px;height:20px;fill:currentColor;flex:none}

/* course page */
.top{padding:40px 0 8px}
.back{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:var(--r-m);color:var(--primary);font:500 14px/20px var(--font)}
.ph{margin:36px 4px 36px}
.ph .over{margin-bottom:8px}
.ph h1{font:400 40px/48px var(--font);letter-spacing:-.01em;margin:0}
.ph p{margin:8px 0 0;color:var(--on-var)}
.num{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:var(--r-s);background:var(--primary);color:var(--on-primary);font:600 12.5px/1 var(--font);letter-spacing:0}
.view{animation:enter .45s var(--emph-dec)}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{color:var(--outline);font-size:13px;text-align:center;margin-top:24px}
@media (max-width:600px){ .hero{padding:72px 0 48px} .mark{font-size:88px} .ph h1{font-size:30px;line-height:38px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

1/PnS/09-random-vectors.html", "title": "Random vectors", "kind": "guide", "over": "Topic 9", "meta": "Interactive guide", "num": 9}, {"href": "2-1/PnS/10-statistical-inference.html", "title": "Statistical inference", "kind": "guide", "over": "Topic 10", "meta": "Interactive guide", "num": 10}, {"href": "2-1/PnS/11-linear-regression.html", "title": "Linear regression", "kind": "guide", "over": "Topic 11", "meta": "Interactive guide", "num": 11}, {"href": "2-1/PnS/01-probability-basics-questions.pdf", "title": "Topic 1 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "18 pages", "num": 1}, {"href": "2-1/PnS/02-discrete-random-variables-questions.pdf", "title": "Topic 2 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "13 pages", "num": 2}, {"href": "2-1/PnS/03-continuous-random-variables-questions.pdf", "title": "Topic 3 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "9 pages", "num": 3}, {"href": "2-1/PnS/04-functions-joint-independence-questions.pdf", "title": "Topic 4 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "18 pages", "num": 4}, {"href": "2-1/PnS/05-conditioning-iterated-expectation-questions.pdf", "title": "Topic 5 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "10 pages", "num": 5}, {"href": "2-1/PnS/06-sums-mgf-questions.pdf", "title": "Topic 6 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "15 pages", "num": 6}, {"href": "2-1/PnS/07-stochastic-simulation-questions.pdf", "title": "Topic 7 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "15 pages", "num": 7}, {"href": "2-1/PnS/08-convergence-limit-theorems-questions.pdf", "title": "Topic 8 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "17 pages", "num": 8}, {"href": "2-1/PnS/09-random-vectors-questions.pdf", "title": "Topic 9 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "14 pages", "num": 9}, {"href": "2-1/PnS/10-statistical-inference-questions.pdf", "title": "Topic 10 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "21 pages", "num": 10}, {"href": "2-1/PnS/11-linear-regression-questions.pdf", "title": "Topic 11 question list (printable)", "kind": "pdf", "over": "PDF", "meta": "7 pages", "num": 11}, {"href": "2-1/PnS/alternative_source_list.pdf", "title": "Alternative source list", "kind": "pdf", "over": "PDF", "meta": "1 pages", "num": null}, {"href": "2-1/PnS/gaussian_iterated_expectation_sources.pdf", "title": "Gaussian and iterated expectation sources", "kind": "pdf", "over": "PDF", "meta": "1 pages", "num": null}, {"href": "2-1/PnS/PnS_L21-L25_Question_List.pdf", "title": "Lectures 21–25 question list", "kind": "pdf", "over": "PDF", "meta": "6 pages", "num": null}, {"href": "2-1/PnS/mgf_questions_solutions.pdf", "title": "MGF questions with solutions", "kind": "pdf", "over": "PDF", "meta": "13 pages", "num": null}, {"href": "2-1/PnS/midsem_question_bank.pdf", "title": "Mid-sem question bank", "kind": "pdf", "over": "PDF", "meta": "6 pages", "num": null}, {"href": "2-1/PnS/midsem_source_list.pdf", "title": "Mid-sem source list", "kind": "pdf", "over": "PDF", "meta": "2 pages", "num": null}, {"href": "2-1/PnS/quiz2_question_list.pdf", "title": "Quiz 2 question list", "kind": "pdf", "over": "PDF", "meta": "8 pages", "num": null}], "report": "<style>\n.report{background:var(--s-low);border-radius:var(--r-xl);padding:28px 30px 26px;margin:0 0 40px;corner-shape:squircle}\n.report h2{font:400 26px/32px var(--font);margin:6px 0 6px}\n.report h3{font:500 16px/24px var(--font);margin:26px 0 8px;color:var(--on)}\n.report p,.report li{color:var(--on-var);font-size:15px;line-height:1.6}\n.report p{margin:6px 0}\n.report ul{margin:6px 0;padding-left:20px}\n.report li{margin:3px 0}\n.report b{color:var(--on);font-weight:500}\n.report a{color:var(--primary)}\n.report a:hover{text-decoration:underline}\n.report .lede{font-size:16px;color:var(--on)}\n.report table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0 4px}\n.report th{font:500 12.5px/16px var(--font);letter-spacing:.04em;color:var(--outline);text-align:left;padding:6px 8px;border-bottom:1px solid var(--outline-var)}\n.report td{padding:5px 8px;color:var(--on-var);vertical-align:middle}\n.report td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--on);white-space:nowrap}\n.report tr.row:hover td{background:var(--s)}\n.report .bar{position:relative;height:14px;min-width:120px}\n.report .bar span{position:absolute;left:0;top:1px;height:12px;border-radius:0 4px 4px 0;background:var(--primary)}\n.report .bar span.out{background:var(--outline-var)}\n.report .bar span.zero{width:2px!important;background:var(--outline-var)}\n.report tr.row:hover .bar span:not(.out):not(.zero){background:#d3e3fd}\n.report .tip{position:relative}\n.report .tip i{display:none;position:absolute;left:0;bottom:22px;z-index:2;white-space:nowrap;font-style:normal;background:var(--s-highest);color:var(--on);padding:6px 10px;border-radius:var(--r-s);font-size:13px}\n.report tr.row:hover .tip i{display:block}\n.report .yr td.n{color:var(--on-var)}\n.report .muted{color:var(--outline)!important}\n.report .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}\n.report .note{font-size:13px;color:var(--outline)}\n@media (max-width:700px){.report{padding:22px 18px}.report .grid2{grid-template-columns:1fr}.report .hide-s{display:none}}\n</style>\n<div class=\"over\">End-sem report · from past papers</div>\n<h2>What the end-sem asks, and what it skips</h2>\n<p class=\"lede\">I went through every end-sem from 2022 onwards (2023, 2024 and 2025 papers with keys, plus the 2022 key) and the two\nsurprise quizzes, and gave each question a topic. The 2023–25 papers come from the same setter: same layout, same cheat sheet,\nand questions repeated word for word. Together they are <b>300 marks</b>.</p>\n\n<h3>Marks per topic, 2023–25 end-sems (300 marks)</h3>\n<table>\n<thead><tr><th>Topic</th><th class=\"hide-s\">Share of 300 marks</th><th style=\"text-align:right\">Marks</th><th style=\"text-align:right\">%</th><th style=\"text-align:right\" class=\"hide-s\">2023</th><th style=\"text-align:right\" class=\"hide-s\">2024</th><th style=\"text-align:right\" class=\"hide-s\">2025</th></tr></thead>\n<tbody>\n<tr class=\"row\"><td><a href=\"2-1/PnS/10-statistical-inference.html\">10 · Statistical inference</a></td><td class=\"hide-s\"><div class=\"bar tip\"><span style=\"width:100%\"></span><i>111 marks · 37% · every year</i></div></td><td class=\"n\">111</td><td class=\"n\">37%</td><td class=\"n hide-s\">40</td><td class=\"n hide-s\">36</td><td class=\"n hide-s\">35</td></tr>\n<tr class=\"row\"><td class=\"muted\">Markov chains (not in our syllabus)</td><td class=\"hide-s\"><div class=\"bar tip\"><span class=\"out\" style=\"width:43.2%\"></span><i>48 marks · 16% · now out of syllabus</i></div></td><td class=\"n muted\">48</td><td class=\"n muted\">16%</td><td class=\"n hide-s muted\">15</td><td class=\"n hide-s muted\">18</td><td class=\"n hide-s muted\">15</td></tr>\n<tr class=\"row\"><td><a href=\"2-1/PnS/06-sums-mgf.html\">6 · Sums of RVs and MGFs</a></td><td class=\"hide-s\"><div class=\"bar tip\"><span style=\"width:40.5%\"></span><i>45 marks · 15% · every year</i></div></td><td class=\"n\">45</td><td class=\"n\">15%</td><td class=\"n hide-s\">10</td><td class=\"n hide-s\">15</td><td class=\"n hide-s\">20</td></tr>\n<tr class=\"row\"><td><a href=\"2-1/PnS/08-convergence-limit-theorems.html\">8 · Convergence and limit theorems</a></td><td class=\"hide-s\"><div class=\"bar tip\"><span style=\"width:29.7%\"></span><i>33 marks · 11% · every year</i></div></td><td class=\"n\">33</td><td class=\"n\">11%</td><td class=\"n hide-s\">15</td><td class=\"n hide-s\">8</td><td class=\"n hide-s\">10</td></tr>\n<tr class=\"row\"><td><a href=\"2-1/PnS/07-stochastic-simulation.html\">7 · Stochastic simulation</a></td><td class=\"hide-s\"><div class=\"bar tip\"><span style=\"width:18%\"></span><i>20 marks · 7% · 2023 and 2025</i></div></td><td class=\"n\">20</td><td class=\"n\">7%</td><td class=\"n hide-s\">10</td><td class=\"n hide-s\">–</td><td class=\"n hide-s\">10</td></tr>\n<tr class=\"row\"><td><a href=\"2-1/PnS/09-random-vectors.html\">9 · Random vectors</a></td><td class=\"hide-s\"><div class=\"bar tip\"><span style=\"width:18%\"></span><i>20 marks · 7% · 2023 and 2024</i></div></td><td class=\"n\">20</td><td class=\"n\">7%</td><td class=\"n hide-s\">10</td><td class=\"n hide-s\">10</td><td class=\"n hide-s\">–</td></tr>\n<tr class=\"row\"><td><a href=\"2-1/PnS/04-functions-joint-independence.html\">4 · Functions, joint distributions, independence</a></td><td class=\"hide-s\"><div class=\"bar tip\"><span style=\"width:11.7%\"></span><i>13 marks · 4% · 2024 only</i></div></td><td class=\"n\">13</td><td class=\"n\">4%</td><td class=\"n hide-s\">–</td><td class=\"n hide-s\">13</td><td class=\"n hide-s\">–</td></tr>\n<tr class=\"row\"><td><a href=\"2-1/PnS/05-conditioning-iterated-expectation.html\">5 · Conditioning and iterated expectation</a></td><td class=\"hide-s\"><div class=\"bar tip\"><span style=\"width:9%\"></span><i>10 marks · 3% · 2025 only</i></div></td><td class=\"n\">10</td><td class=\"n\">3%</td><td class=\"n hide-s\">–</td><td class=\"n hide-s\">–</td><td class=\"n hide-s\">10</td></tr>\n<tr class=\"row\"><td><a href=\"2-1/PnS/11-linear-regression.html\">11 · Linear regression</a></td><td class=\"hide-s\"><div class=\"bar tip\"><span class=\"zero\"></span><i>never asked so far</i></div></td><td class=\"n\">0</td><td class=\"n\">0%</td><td class=\"n hide-s\">–</td><td class=\"n hide-s\">–</td><td class=\"n hide-s\">–</td></tr>\n<tr class=\"row\"><td>1–3 · Probability basics, discrete and continuous RVs</td><td class=\"hide-s\"><div class=\"bar tip\"><span class=\"zero\"></span><i>never asked in an end-sem (quiz 1 / midsem only)</i></div></td><td class=\"n\">0</td><td class=\"n\">0%</td><td class=\"n hide-s\">–</td><td class=\"n hide-s\">–</td><td class=\"n hide-s\">–</td></tr>\n</tbody></table>\n<p class=\"note\">2022 is left out of the counts: only its key survives and it shows no marks. Its 10 questions were 5 on inference (two of them hypothesis tests), 2 on MGFs and sums, 2 on functions/min-max and 1 on iterated expectation. That key looks like a different offering, since several questions are copied from ProbabilityCourse.com.</p>\n\n<h3>Asked every year: the core of the paper</h3>\n<ul>\n<li><b>MLE, 2–3 questions every year (20–30 marks).</b> Gaussian mean and SD (2023), Gaussian variance with known mean (2024),\nUniform[0,a] (2023) and Uniform[a,b] (2024 and 2025, word for word; the maximum is on the boundary, so setting the derivative to zero doesn't work), and Poisson rate (2023, then 2024 and 2025 word for word, with its MSE).</li>\n<li><b>Bias / MSE of an estimator, every year.</b> Bias of σ̂ or σ̂², MSE of the Poisson MLE, \"define MSE and explain the bias–variance trade-off\" (2025), and the MSE of three estimators of the mean (2025 surprise quiz, 10 marks).</li>\n<li><b>Conjugate-prior Bayesian question, every year (10–15 marks).</b> Beta–Bernoulli (2023), Gamma–Poisson (2024), Gamma–Exponential (2025): find the posterior and then the MAP. The keys give 7 marks for the posterior and 3 for the MAP, and they evaluate the normaliser as a Gamma function.</li>\n<li><b>An MGF derivation, every year (10 marks).</b> Gaussian MGF and sums of Gaussians (2023), shifted exponential (2024), Geometric and Exponential (2025), and the random-sum identity M_Z(t) = M_N(log M_X(t)) (2024). <b>The keys always state the domain of t</b>, and marks depend on it.</li>\n<li><b>A convergence proof from first principles, every year (8–15 marks).</b> Convergence in probability and in distribution (Laplace(n) in 2023, Uniform(5 ± 1/n) in 2025), mean square (Poisson(nλ)/n in 2023), and in probability plus almost surely via Borel–Cantelli (Xₙ = n w.p. 1/n², 2024).</li>\n</ul>\n\n<h3>Asked often</h3>\n<ul>\n<li><b>Simulation (2 of 3 years, 10 marks).</b> Prove discrete accept–reject is correct (2023); Monte Carlo estimate of π with justification (2025). A \"simulate a Markov coin from these uniforms\" question (2024, and the 2025 surprise quiz) is really inverse transform.</li>\n<li><b>Random vectors / Jacobian (2 of 3 years, 10 marks).</b> The Jacobian for (X₁+X₂, X₁/(X₁+X₂)) (2023); X = AZ + μ: mean, covariance and PDF (2024). They also made up 22.5 of the 30 marks in the 2024 surprise quiz.</li>\n<li><b>Sums by convolution.</b> Erlang(2) by convolution (2025) and sums of Gaussians via MGF (2023).</li>\n</ul>\n\n<h3>Asked rarely or never</h3>\n<div class=\"grid2\">\n<ul>\n<li><b>Topics 1–3</b> (counting, axioms, named distributions, single continuous RVs): never in an end-sem. They are Quiz 1 and midsem material, but the later questions use them all the time.</li>\n<li><b>Functions of one RV, min/max:</b> once (2024: log-normal PDF, max/min PDFs; 13 marks).</li>\n<li><b>Iterated expectation:</b> once (2025: a mixture, 10 marks), though the midsems ask it every year.</li>\n</ul>\n<ul>\n<li><b>Numerical Chebyshev / Markov / CLT approximations:</b> never in 2023–25. The CLT only shows up as \"state it\".</li>\n<li><b>Covariance of scalar RVs, law of total variance:</b> never.</li>\n<li><b>Linear regression / least squares:</b> never asked yet; it is new in this year's lectures. <b>Hypothesis tests and confidence intervals:</b> only in 2022.</li>\n</ul>\n</div>\n\n<h3>What to expect this year</h3>\n<ul>\n<li><b>About 15–18 marks are free this year</b>: Markov chains used to take them and are out of the syllabus. The likeliest places for those marks are inference, random vectors (which the 2026 Quiz 2 tested) and possibly the new linear regression lectures.</li>\n<li><b>Order of preparation:</b> <a href=\"2-1/PnS/10-statistical-inference.html\">inference</a> (MLE including boundary cases, bias/MSE, posterior + MAP) →\n<a href=\"2-1/PnS/06-sums-mgf.html\">MGFs with domains</a> → <a href=\"2-1/PnS/08-convergence-limit-theorems.html\">convergence proofs</a> →\n<a href=\"2-1/PnS/07-stochastic-simulation.html\">simulation proofs</a> and <a href=\"2-1/PnS/09-random-vectors.html\">Gaussian vectors / Jacobians</a> →\n<a href=\"2-1/PnS/11-linear-regression.html\">regression</a> → the rest.</li>\n<li><b>He repeats questions word for word</b> (2024 → 2025: the Uniform[a,b] MLE and the Poisson MLE + MSE). Every past-paper question is marked <b>★ Must-do</b> in the topic guides above. The exceptions are the two 2022 hypothesis-test questions, which this year's lectures don't teach; they sit in an optional section.</li>\n<li><b>Write answers the way the keys do:</b> state the support or range first, name the method, justify each step (independence, monotonicity, LOTUS), give the MGF's domain, and box the final result.</li>\n</ul>\n"}];
const P={
  back:'m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z',
  guide:'M240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h480q33 0 56.5 23.5T800-800v640q0 33-23.5 56.5T720-80H240Zm0-80h480v-640h-80v280l-100-60-100 60v-280H240v640Z',
  pdf:'M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520Z'
};
const ic=n=>'<svg class="ic" viewBox="0 -960 960 960" aria-hidden="true"><path d="'+P[n]+'"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');

function home(){
  const n=DATA.reduce((a,c)=>a+c.items.length,0);
  return '<section class="hero"><h1 class="mark">cwd</h1><p class="tag">Current Working Directory for what you&rsquo;re currently working on</p></section>'
    +'<div class="head"><h2>Courses</h2><span>'+DATA.length+' courses · '+n+' files</span></div>'
    +'<div class="grid">'+DATA.map(c=>'<a class="card ripple" href="#/'+encodeURIComponent(c.id)+'">'
      +'<span class="over">'+esc(c.code)+'</span><span class="title">'+esc(c.name)+'</span>'
      +'<span class="meta">'+esc(c.term)+' · '+c.items.length+' files</span></a>').join('')+'</div>';
}
function card(it){
  const over=it.kind==='guide'?(it.num&&/^Topic/.test(it.over)?'<span class="num">'+it.num+'</span>':ic('guide'))+esc(it.over):ic('pdf')+'PDF';
  return '<a class="card ripple '+it.kind+'" href="'+encodeURI(it.href)+'"'+(it.kind==='pdf'?' target="_blank" rel="noopener"':'')+'>'
    +'<span class="over">'+over+'</span><span class="title">'+esc(it.title)+'</span><span class="meta">'+esc(it.meta)+'</span></a>';
}
function course(c){
  const g=c.items.filter(i=>i.kind==='guide'), p=c.items.filter(i=>i.kind!=='guide');
  let h='<div class="top"><a class="back ripple" href="#/">'+ic('back')+'All courses</a></div>'
    +'<header class="ph"><div class="over">'+esc(c.code)+' · '+esc(c.term)+'</div><h1>'+esc(c.name)+'</h1><p>'+c.items.length+' files</p></header>';
  if(g.length) h+='<div class="head"><h2>Chapters</h2><span>'+g.length+' interactive guides</span></div><div class="grid">'+g.map(card).join('')+'</div>';
  if(c.report) h+='<section class="report">'+c.report+'</section>';
  if(p.length) h+='<div class="head"><h2>'+(g.length?'More material':'Files')+'</h2><span>'+p.length+' PDFs</span></div><div class="grid">'+p.map(card).join('')+'</div>';
  return h;
}
function route(){
  const id=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  const c=DATA.find(x=>x.id===id);
  app.innerHTML='<div class="view">'+(c?course(c):home())+'</div>';
  document.title=c?c.code+' · cwd':'cwd';
  window.scrollTo(0,0);
}
addEventListener('hashchange',route); route();
document.addEventListener('pointerdown',e=>{ const t=e.target.closest('.ripple'); if(!t) return;
  const r=t.getBoundingClientRect(), d=Math.max(r.width,r.height)*2.2, s=document.createElement('span');
  s.className='rip'; s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  t.appendChild(s); setTimeout(()=>s.remove(),650); });
</script>
